<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MEDORA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1F2B'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23E4382C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" aria-label="MEDORA home"><span class="brand-mark" aria-hidden="true"></span>MEDORA</a>
  <nav><a class="btn ghost" href="signup.html" id="to-signup">Create account</a></nav>
</header>
<main class="authpage">
  <section class="authcard">
    <h1 id="title">Sign in</h1>
    <p class="muted" id="sub">Use the username and password you registered with.</p>
    <form id="login-form" autocomplete="on" novalidate>
      <label class="field">Username
        <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">Password
        <span class="pwrow"><input id="pass" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="btn ghost small" id="showpw" aria-pressed="false">Show</button></span>
      </label>
      <p id="err" class="err" role="alert" hidden></p>
      <button class="btn dark big" id="go" type="submit">Sign in</button>
    </form>
    <p class="small-t muted">No account yet? <a href="signup.html" id="su-link">Sign up</a>.</p>
  </section>
</main>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(() => {
  const { api, session, saveSession, params, home } = MedoraAuth;
  const $ = s => document.querySelector(s);
  if (session && session.token) { home(session.role); return; }          // pehle se sign in hai
  const role = params.get('role') === 'hospital' ? 'hospital' : params.get('role') === 'ambulance' ? 'ambulance' : '';
  if (role) { $('#title').textContent = (role === 'ambulance' ? 'Ambulance' : 'Hospital') + ' sign in'; $('#su-link').href = $('#to-signup').href = 'signup.html?role=' + role; }
  $('#showpw').onclick = e => { const p = $('#pass'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; e.target.setAttribute('aria-pressed', show); };
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#go'), err = $('#err'); err.hidden = true;
    const username = $('#user').value.trim().toLowerCase(), password = $('#pass').value;
    if (!username || !password) { err.textContent = 'Enter your username and password.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const r = await api('/auth/login', { method: 'POST', body: { username, password } });
      saveSession({ token: r.token, role: r.role, username });
      home(r.role);
    } catch (ex) { err.textContent = ex.message; err.hidden = false; $('#pass').value = ''; $('#pass').focus(); btn.disabled = false; btn.textContent = 'Sign in'; }
  });
})();
</script>
</body>
</html>
